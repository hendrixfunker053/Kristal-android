
name: Kristal Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kristal
        uses: actions/checkout@v4
        with:
          path: kristal

      - name: Checkout LÖVE Android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: main
          submodules: recursive
          path: love-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zip unzip

      - name: Build Kristal Android
        working-directory: kristal
        run: |
          python3 build.py \
            --kristal . \
            --android \
            --love-android ../love-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kristal-Android
          path: kristal/output/Kristal-Android.apk
          if-no-files-found: error
