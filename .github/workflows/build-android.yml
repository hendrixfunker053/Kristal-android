
name: Kristal Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------

      - name: Checkout Kristal
        uses: actions/checkout@v4
        with:
          path: kristal

      - name: Checkout LÖVE Android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: main
          submodules: recursive
          path: love-android

      # ----------------------------------------
      # JAVA & PYTHON
      # ----------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ----------------------------------------
      # DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            zip \
            unzip

      # ----------------------------------------
      # GRADLE MEMORY CONFIGURATION
      # ----------------------------------------

      - name: Configure Gradle memory
        working-directory: love-android
        run: |
          touch gradle.properties

          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          sed -i '/^org.gradle.workers.max=/d' gradle.properties
          sed -i '/^org.gradle.parallel=/d' gradle.properties
          sed -i '/^org.gradle.daemon=/d' gradle.properties

          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.daemon=false
          EOF

      # ----------------------------------------
      # BUILD KRISTAL ANDROID
      # ----------------------------------------

      - name: Build Kristal Android
        working-directory: kristal
        run: |
          python3 build.py \
            --kristal . \
            --android \
            --love-android ../love-android

      # ----------------------------------------
      # VERIFY APK
      # ----------------------------------------

      - name: Verify APK
        run: |
          if [ ! -f kristal/output/Kristal-Android.apk ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          ls -lh kristal/output/Kristal-Android.apk

      # ----------------------------------------
      # UPLOAD APK
      # ----------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kristal-Android
          path: kristal/output/Kristal-Android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
